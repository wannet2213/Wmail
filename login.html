<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk - Wmail</title>
<link rel="icon" href="assets/images/wmail-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="page">
<main class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="brand">
      <img src="assets/images/wmail-logo.svg" alt="" width="40" height="30">
      <span class="brand-name">Wmail</span>
    </div>
    <h1>Masuk</h1>
    <p>Akun dibuat oleh admin server.</p>
    <div class="settings-field">
      <label for="username">Username</label>
      <input class="settings-input" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="settings-field">
      <label for="password">Password</label>
      <input class="settings-input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="form-error" id="loginError" role="alert"></div>
    <button class="send-btn" type="submit" id="loginBtn">Masuk</button>
  </form>
</main>
<script type="module" src="assets/login.js"></script>
</body>
</html>
