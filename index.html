<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wmail</title>
<link rel="icon" href="assets/images/wmail-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script src="assets/theme.js"></script>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Tampilkan/sembunyikan menu" aria-controls="panel"><span class="ms">menu</span></button>
  <a class="brand" href="/" aria-label="Wmail">
    <img src="assets/images/wmail-logo.svg" alt="" width="40" height="30">
    <span class="brand-name">Wmail</span>
  </a>
  <div class="search" role="search">
    <span class="iconbtn" aria-hidden="true"><span class="ms">search</span></span>
    <input id="searchInput" type="search" placeholder="Cari email" aria-label="Cari email">
  </div>
  <div class="topbar-end">
    <a class="iconbtn" href="/settings.html" aria-label="Pengaturan"><span class="ms">settings</span></a>
    <button class="avatar" id="accountBtn" popovertarget="accountMenu" aria-label="Akun">?</button>
  </div>
</header>

<div id="accountMenu" class="account-menu" popover>
  <div class="account-name" id="accountName"></div>
  <label class="account-item theme-pick"><span class="ms">lightbulb</span>Tema
    <select id="themeSelect" aria-label="Tema">
      <option value="system">Ikuti sistem</option>
      <option value="light">Terang</option>
      <option value="dark">Gelap</option>
    </select></label>
  <a class="account-item" href="/settings.html">Pengaturan</a>
  <button class="account-item" id="logoutBtn">Keluar</button>
</div>

<div class="shell">
  <section class="panel" id="panel" aria-label="Mailbox">
    <button class="compose-btn" id="composeBtn">
      <span class="ms">edit</span><span>Tulis</span>
    </button>
    <label class="mbx-select" id="mailboxPicker" hidden>
      <span class="msf">inbox</span>
      <select id="mailboxSelect" aria-label="Pilih mailbox"></select>
    </label>
    <nav class="navlist" id="navlist"></nav>
  </section>

  <main class="workarea">
    <div class="list-tools">
      <div class="tools-left">
        <button class="iconbtn sel-all" aria-label="Pilih semua">
          <span class="ms" id="selAllIcon">check_box_outline_blank</span>
        </button>
        <button class="iconbtn" id="btn-refresh" aria-label="Muat ulang"><span class="ms">refresh</span></button>
        <span class="tools-left" id="bulkTools" hidden>
          <button class="iconbtn" data-bulk="archive" aria-label="Arsipkan"><span class="ms">archive</span></button>
          <button class="iconbtn" data-bulk="inbox" aria-label="Pindahkan ke Kotak masuk"><span class="msf">inbox</span></button>
          <button class="iconbtn" data-bulk="delete" aria-label="Hapus"><span class="ms">delete</span></button>
          <button class="iconbtn" data-bulk="read" aria-label="Tandai sudah dibaca"><span class="msf">drafts</span></button>
          <button class="iconbtn" data-bulk="unread" aria-label="Tandai belum dibaca"><span class="ms">mark_email_unread</span></button>
        </span>
      </div>
      <div class="tools-right">
        <span class="page-count" id="pageCount"></span>
      </div>
    </div>
    <div class="mailrows" id="mailrows" role="list"></div>
    <section class="reader" id="reader" hidden aria-label="Isi email">
      <div class="reader-tools">
        <div class="tools-left">
          <button class="iconbtn" id="readerBack" aria-label="Kembali"><span class="ms">arrow_back</span></button>
          <button class="iconbtn" id="btnRArchive" aria-label="Arsipkan"><span class="ms">archive</span></button>
          <button class="iconbtn" id="btnRInbox" aria-label="Pindahkan ke Kotak masuk"><span class="msf">inbox</span></button>
          <button class="iconbtn" id="btnRSpam" aria-label="Tandai spam"><span class="ms">report</span></button>
          <button class="iconbtn" id="btnRDelete" aria-label="Hapus"><span class="ms">delete</span></button>
          <button class="iconbtn" id="btnRUnread" aria-label="Tandai belum dibaca"><span class="ms">mark_email_unread</span></button>
          <button class="iconbtn" id="btnRSnooze" aria-label="Tunda"><span class="ms">schedule</span></button>
        </div>
        <div class="tools-right">
          <span class="page-count" id="readerPos"></span>
        </div>
      </div>
      <article class="reader-body" id="readerBody"><div id="readerThread"></div></article>
    </section>
  </main>
</div>

<section class="compose" id="compose" hidden role="dialog" aria-label="Pesan baru">
  <header class="compose-head">
    <span class="compose-title">Pesan baru</span>
    <span class="compose-head-btns">
      <button class="iconbtn" id="composeMin" aria-label="Kecilkan"><span class="ms">remove</span></button>
      <button class="iconbtn" id="composeFull" aria-label="Layar penuh"><span class="ms">fullscreen</span></button>
      <button class="iconbtn" id="composeClose" aria-label="Tutup"><span class="ms">close</span></button>
    </span>
  </header>
  <div class="compose-to compose-from">
    <span class="compose-label">Dari</span>
    <select id="composeFrom" aria-label="Kirim dari"></select>
  </div>
  <div class="compose-to">
    <span class="ms compose-mode" id="composeMode" aria-hidden="true">reply</span>
    <input id="composeTo" type="text" placeholder="Kepada" aria-label="Penerima">
    <button type="button" class="text-toggle" data-show="composeCcRow" aria-label="Tambah penerima Cc">Cc</button>
    <button type="button" class="text-toggle" data-show="composeBccRow" aria-label="Tambah penerima Bcc">Bcc</button>
  </div>
  <div class="compose-cc" id="composeCcRow" hidden>
    <input id="composeCc" type="text" placeholder="Cc" aria-label="Penerima Cc">
  </div>
  <div class="compose-cc" id="composeBccRow" hidden>
    <input id="composeBcc" type="text" placeholder="Bcc (tidak terlihat penerima lain)" aria-label="Penerima Bcc">
  </div>
  <input id="composeSubject" class="compose-subject" type="text" placeholder="Subjek" aria-label="Subjek">
  <input type="hidden" id="composeInReplyTo" value="">
  <div id="composeBody" class="compose-body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Isi pesan"></div>
  <button type="button" class="quote-toggle" id="btnQuote" aria-label="Tampilkan teks yang dikutip" aria-expanded="false" hidden><span aria-hidden="true">•••</span></button>
  <div id="composeQuote" class="compose-quote" aria-label="Teks yang dikutip" hidden></div>
  <div class="compose-attachments" id="composeAttachments" hidden></div>
  <input type="file" id="composeFileInput" multiple hidden>
  <div class="format-bar" id="formatBar" role="toolbar" aria-label="Format teks" hidden>
    <button type="button" data-cmd="bold" aria-label="Tebal (Ctrl+B)"><b>B</b></button>
    <button type="button" data-cmd="italic" aria-label="Miring (Ctrl+I)"><i>I</i></button>
    <button type="button" data-cmd="underline" aria-label="Garis bawah (Ctrl+U)"><u>U</u></button>
    <button type="button" data-cmd="strikeThrough" aria-label="Coret"><s>S</s></button>
    <span class="format-sep" aria-hidden="true"></span>
    <button type="button" data-cmd="insertUnorderedList" aria-label="Daftar berpoin">•&#x2009;—</button>
    <button type="button" data-cmd="insertOrderedList" aria-label="Daftar bernomor">1.&#x2009;—</button>
    <button type="button" data-cmd="formatBlock" data-arg="blockquote" aria-label="Kutipan">❝</button>
    <span class="format-sep" aria-hidden="true"></span>
    <button type="button" data-cmd="removeFormat" aria-label="Hapus format"><s>T</s><sub>x</sub></button>
  </div>
  <footer class="compose-foot">
    <span class="send-split">
      <button class="send-btn" id="sendBtn"><span class="msf">send</span><span>Kirim</span></button>
      <button class="send-more" id="sendMore" popovertarget="sendMenu" aria-label="Opsi kirim lainnya"><span class="ms">expand_more</span></button>
    </span>
    <button class="iconbtn fmt-toggle" id="btnFormat" aria-label="Opsi format" aria-pressed="false"><span aria-hidden="true">Aa</span></button>
    <button class="iconbtn" id="btnAttach" aria-label="Lampirkan file"><span class="ms">attach_file</span></button>
    <button class="iconbtn" id="btnLink" aria-label="Sisipkan link"><span class="ms">link</span></button>
    <button class="iconbtn" id="btnEmoji" popovertarget="emojiPanel" aria-label="Sisipkan emoji"><span class="ms">mood</span></button>
    <button class="iconbtn" id="btnSignature" aria-label="Sisipkan tanda tangan"><span class="ms">create</span></button>
    <span class="compose-foot-end">
      <button class="iconbtn" id="composeDiscard" aria-label="Buang draf"><span class="ms">delete</span></button>
    </span>
  </footer>
</section>

<div id="sendMenu" class="pop-menu" popover>
  <button class="account-item" id="btnSchedule"><span class="ms">schedule</span>Jadwalkan pengiriman</button>
</div>
<div id="emojiPanel" class="pop-menu emoji-panel" popover aria-label="Emoji"></div>

<dialog id="scheduleDialog" class="schedule-dialog" aria-labelledby="scheduleTitle">
  <h2 id="scheduleTitle">Jadwalkan pengiriman</h2>
  <div id="schedulePresets"></div>
  <div class="settings-field">
    <label for="scheduleAt">Pilih tanggal &amp; waktu</label>
    <input class="settings-input" id="scheduleAt" type="datetime-local">
  </div>
  <div class="dialog-actions">
    <button type="button" class="text-btn" id="scheduleCancel">Batal</button>
    <button type="button" class="send-btn" id="scheduleCustom">Jadwalkan</button>
  </div>
</dialog>

<div class="snackbar" id="snackbar" role="status" hidden>
  <span id="snackText"></span>
  <button id="snackUndo" hidden>Urungkan</button>
</div>

<script type="module" src="assets/app.js"></script>
</body>
</html>
